<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MasMoney</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<div class="topbar">

<div>

<h1>MasMoney 💰</h1>
<p>Kelola keuangan dengan mudah</p>

</div>

<div class="profile">

<img src="https://i.pravatar.cc/100">

<div>
<h3>Yusron</h3>
<small>Finance Dashboard</small>
</div>

</div>

</div>


<div class="cards">

<div class="card balance">

<h3>Total Saldo</h3>

<h1 id="saldo">
Rp 0
</h1>

</div>

<div class="card income">

<h3>Pemasukan</h3>

<h1 id="masuk">
Rp 0
</h1>

</div>

<div class="card expense">

<h3>Pengeluaran</h3>

<h1 id="keluar">
Rp 0
</h1>

</div>

<div class="card transaction">

<h3>Transaksi</h3>

<h1 id="jumlahTransaksi">
0
</h1>

</div>

</div>

<div class="box">

<h2>Statistik Keuangan</h2>

<div class="chart-filter">
  <label for="startDateDaily">Dari:</label>
  <input id="startDateDaily" type="date">
  <label for="endDateDaily">Sampai:</label>
  <input id="endDateDaily" type="date">
  <button onclick="applyDailyFilter()">Terapkan</button>
  <button onclick="resetDailyFilter()">Reset</button>
</div>

<canvas id="financeChart"></canvas>

</div>

<div class="box">
  <div class="box-header">
    <h2>Rekap Bulanan</h2>
  </div>
  <div class="chart-filter monthly-filter">
    <label for="monthFrom">Bulan dari:</label>
    <input id="monthFrom" type="month">
    <label for="monthTo">sampai:</label>
    <input id="monthTo" type="month">
    <button onclick="applyMonthlyFilter()">Terapkan</button>
    <button onclick="resetMonthlyFilter()">Reset</button>
  </div>
  <div class="monthly-recap">
    <div class="recap-item">
      <span>Bulan</span>
      <strong id="rekapBulanDisplay">-</strong>
    </div>
    <div class="recap-item">
      <span>Pemasukan</span>
      <strong id="rekapMasuk">Rp 0</strong>
    </div>
    <div class="recap-item">
      <span>Pengeluaran</span>
      <strong id="rekapKeluar">Rp 0</strong>
    </div>
  </div>
  <canvas id="recapChart"></canvas>
</div>

<div class="grid">

<div class="left">

<div class="box">

<div class="box-header">
  <h2>Riwayat Transaksi</h2>
</div>

<div class="table-filter">
  <label for="startDateTable">Dari:</label>
  <input id="startDateTable" type="date">
  <label for="endDateTable">Sampai:</label>
  <input id="endDateTable" type="date">
  <label for="limitRecords">Tampilkan:</label>
  <input id="limitRecords" type="number" min="1" placeholder="Jumlah">
  <button onclick="applyTableFilter()">Terapkan</button>
  <button onclick="resetTableFilter()">Reset</button>
</div>

<div class="table-responsive">
  <table>
    <thead>
      <tr>
        <th>Tanggal</th>
        <th>Kategori</th>
        <th>Keterangan</th>
        <th>Tipe</th>
        <th>Jumlah</th>
      </tr>
    </thead>
    <tbody id="transaksiData"></tbody>
  </table>
</div>

</div>

</div>



<div class="right">

<div class="box">

<h2>Tambah Transaksi</h2>

<input id="kategori" placeholder="Kategori">

<input id="keterangan" placeholder="Keterangan">

<input id="tanggal" type="date" placeholder="Tanggal">

<input id="jumlah" type="number" placeholder="Jumlah">

<select id="tipe">

<option value="Pemasukan">
Pemasukan
</option>

<option value="Pengeluaran">
Pengeluaran
</option>

</select>

<button onclick="tambahData()" class="btn">

Tambah

</button>

</div>

</div>

</div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
